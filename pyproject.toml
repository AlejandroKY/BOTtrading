[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "futbot"
version = "0.1.0"
description = "Backtesting de estrategias intradía de futuros (ES, NQ, GC, CL, ZN, 6E) y simulador de evaluaciones de prop firms"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "pyarrow>=12"]

[tool.setuptools]
packages = ["futbot", "futbot.strategies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
